<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LFW Local Assets</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 { color: #ffcc33; }
    code { background: #333; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>本地资源拦截已生效</h1>
  <p>这个页面来自 <code>app/src/main/assets/www/index.html</code>，<br/>
     通过 <code>shouldInterceptRequest</code> 拦截 <code>http://localhost:3000/</code> 请求提供。</p>
  <p>将 Little-Fighter-Wemake Web 版构建产物（dist 目录内容）<br/>
     复制到 <code>app/src/main/assets/www/</code> 即可替换为真实游戏。</p>
</body>
</html>
